[project]
name = "narrowgate"
version = "0.1.0"
description = "A minimal agent harness for local open-weight models whose safety argument does not depend on the model's cooperation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.11.7",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "ruff==0.12.7"]

[project.scripts]
narrowgate = "narrowgate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
