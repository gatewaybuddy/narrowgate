# narrowgate config — REFERENCES ONLY. Never put a secret value in this file.

llm:
  base_url: "http://localhost:8001/v1"   # vLLM OpenAI-compatible endpoint
  model: "nemotron-lightning"
  # Name of an env var holding the key — NEVER the key itself.
  # null is correct for a local vLLM with no auth, which is the common case on an
  # isolated box. Set it only if your endpoint actually requires a key; if you name
  # a var here it MUST be set, or startup fails closed rather than sending nothing.
  api_key_env: null
  timeout_s: 120
  max_tokens: 4096

workspace:
  root: "./workspace"        # every file tool is confined to this directory
  max_file_bytes: 1048576

network:
  # Deny-by-default. A tool declaring requires_network=True still cannot run
  # unless its name appears here. Empty list = no tool may touch the network.
  allow_tools: []

audit:
  path: "./audit/narrowgate.jsonl"   # append-only; cannot be disabled

agent:
  max_turns: 24
  # Refuse to start if the endpoint does not emit well-formed tool_calls.
  require_native_tool_calls: true
